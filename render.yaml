services:
  - type: web
    name: sanatan-media-platform
    env: node
    plan: free
    region: singapore
    buildCommand: NPM_CONFIG_PRODUCTION=false npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=2048"
      - key: PORT
        value: "10000"
